<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos do Neymar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .gallery img {
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 100%;
            height: auto;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Fotos do Neymar</h1>
    </header>

    <section class="gallery">
        <img src="https://tmssl.akamaized.net/images/foto/galerie/neymar-brazil-2022-1668947300-97010.jpg" alt="Neymar 1">
        <img src="https://i.pinimg.com/736x/af/1c/94/af1c94846ffb3144d9a2bc46bc51cbec.jpg" alt="Neymar 2">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Neymar_-_FC_Barcelona_-_2015.jpg/649px-Neymar_-_FC_Barcelona_-_2015.jpg" alt="Neymar 3">
        <img src="https://static.gazetaesportiva.com/uploads/imagem/2019/04/08/Neymar-1024x683.jpg" alt="Neymar 4">
    </section>

    <footer>
        <p>&copy; 2023 Fotos do Neymar. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
